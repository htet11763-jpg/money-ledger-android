name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify web app
        run: |
          test -f www/index.html
          echo "Found www/index.html"

      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "money-ledger-android",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "8.5.1",
              "@capacitor/cli": "8.5.1",
              "@capacitor/android": "8.5.1",
              "@capacitor/app": "8.5.1"
            }
          }
          EOF

      - name: Install dependencies
        run: npm install

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.htet11763.moneyledger",
            "appName": "Money Ledger",
            "webDir": "www"
          }
          EOF

      - name: Create Android project
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Money-Ledger-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error