async function get(k,shared=true){try{if(window.storage?.get)return await window.storage.get(k,shared)}catch(e){}try{let v=localStorage.getItem(k);return v?{value:v}:null}catch(e){return null}}async function put(k,v,shared=true){try{if(window.storage?.set){await window.storage.set(k,v,shared);return}}catch(e){}localStorage.setItem(k,v)}async function save(skipAuto=false){try{await put(KEY,JSON.stringify(S),true);if(!skipAuto)setTimeout(()=>maybeAutoBackup(),700)}catch(e){toast('Data save failed')}}async function saveDevice(){try{await put(DEVICE,JSON.stringify(device),false)}catch(e){}}

function providerKey(p){let x=String(p||'').toLowerCase();if(x.includes('kbzpay'))return'kpay';if(x.includes('wave'))return'wave';if(x.includes('aya'))return'aya';if(x.includes('cb'))return'cb';if(x.includes('yoma'))return'yoma';if(x.includes('mab'))return'mab';if(x.includes('uab'))return'uab';return'default'}function providerClass(p){return'provider-'+providerKey(p)}function providerIcon(p){let k=providerKey(p);return k==='kpay'?'K':k==='wave'?'W':k==='aya'?'A':k==='cb'?'CB':k==='yoma'?'Y':k==='mab'?'M':k==='uab'?'U':'$'}
function accountBalance(id){let a=S.accounts.find(x=>x.id===id);if(!a)return 0;let total=num(a.openingBalance);for(let x of S.transactions){if(x.accountId===id&&x.status==='posted')total+=num(x.accountDelta||0)}return total}function cashBalance(){return S.cashLedger.reduce((a,x)=>a+num(x.delta),0)}

function goBack(){
  if(ui.modal){ui.modal=null;render();return true}
  if(ui.page==='dateSearch'){ui.page=null;render();return true}
  if(ui.page==='accountDetail'){ui.page=null;ui.accountId=null;render();return true}
  if(ui.page==='staffDetail'){ui.page='staff';ui.staffId=null;render();return true}
  if(ui.page){ui.page=null;ui.staffId=null;ui.accountId=null;render();return true}
  if(ui.tab==='records'&&ui.accountId){ui.accountId=null;render();return true}
  if(ui.tab!=='home'){ui.tab='home';ui.page=null;ui.accountId=null;ui.staffId=null;render();return true}
  return false
}
function setupBackNavigation(){
  if(window.__moneyLedgerBackReady)return;
  window.__moneyLedgerBackReady=true;
  window.addEventListener('popstate',()=>{if(!goBack()) history.pushState({ml:'home'},'','#home')});
  try{
    const App=window.Capacitor?.Plugins?.App;
    if(App?.addListener){
      App.addListener('backButton',({canGoBack})=>{
        if(!goBack() && canGoBack) window.history.back();
        else if(!canGoBack) history.pushState({ml:'home'},'','#home');
      });
    }
  }catch(e){}
  if(!history.state?.ml) history.replaceState({ml:'home'},'','#home');
}

function accountCard(a){let lim1=a.receiveLimit?money(a.receiveLimit):t('noLimit'),lim2=a.sendLimit?money(a.sendLimit):t('noLimit');return `<article class="account-card ${providerClass(a.provider)}" data-a="accountDetail" data-id="${a.id}" role="button" tabindex="0"><div class="account-actions">${role==='owner'?`<button class="icon-btn" data-a="editacc" data-id="${a.id}">✎</button><button class="icon-btn" data-a="archiveacc" data-id="${a.id}">×</button>`:''}</div><div class="account-top"><div class="provider-icon">${providerIcon(a.provider)}</div><div class="provider-meta"><div class="provider-name">${esc(a.provider)}</div><div class="account-name">${esc(a.name)}</div></div></div><div class="account-balance">${money(accountBalance(a.id))} Ks</div><div class="account-footer"><span>↓ ${t('receiveLimit')}: ${lim1}</span><span>↑ ${t('sendLimit')}: ${lim2}</span></div><div class="account-open-hint">${t('accountDetail')} ›</div></article>`}
function entry(){form.date=form.date||today();let accounts=S.accounts.filter(a=>!a.archived),opts=accounts.map(a=>`<option value="${a.id}" ${form.accountId===a.id?'selected':''}>${esc(a.provider)} · ${esc(a.name)} · ${money(accountBalance(a.id))} Ks</option>`).join('');let autoFee=feeFor(form.type,num(form.amount)),fee=form.fee!==''?num(form.fee):autoFee,rule=S.settings.feeRules[form.type];return `<main class="page"><div class="eyebrow">${t('entry')}</div><h1 class="page-title">${t('entry')}</h1>${!activeShift()?`<div class="notice warn">${t('noShift')}</div>`:''}<div class="card"><div class="field"><label>${t('recordedBy')}</label><select id="entryStaff" class="select"><option value="">${t('choose')}</option>${S.settings.staffList.filter(x=>x.active!==false).map(x=>`<option value="${x.id}" ${selectedStaff()?.id===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><div class="hint">${S.settings.language==='my'?'ဒီမှတ်တမ်းကို ဘယ်ဝန်ထမ်းနာမည်နဲ့ သိမ်းမလဲ ရွေးပါ။':'Choose the staff who is recording this transaction.'}</div></div><div class="seg" style="margin-bottom:15px"><button class="${form.type==='transfer'?'on':''}" data-a="type" data-v="transfer">${t('transfer')}</button><button class="${form.type==='cashout'?'on':''}" data-a="type" data-v="cashout">${t('cashout')}</button></div><div class="field"><label>${t('account')}</label><select id="entryAccount" class="select"><option value="">${t('selectAccount')}</option>${opts}</select></div><div class="row"><div class="field"><label>${t('amount')}</label><input id="amount" type="number" min="1" inputmode="numeric" value="${esc(form.amount)}" placeholder="100000"></div><div class="field"><label>${t('fee')} · ${S.settings.language==='my'?'ကိုယ်တိုင်ပြင်နိုင်သည်':'Editable'}</label><div class="fee-edit"><div class="fee-input-wrap"><input id="fee" type="number" min="0" step="1" inputmode="numeric" value="${fee}" aria-label="${t('fee')}"><span class="ks">Ks</span></div></div></div></div><div class="fee-preview"><span>${t('autoFee')} ${rule.rate?`(${rule.rate}%)`:''} · ${S.settings.language==='my'?'လိုအပ်ရင် ပြင်ပါ':'Edit if needed'}</span><b id="feePreview">${money(fee)} Ks</b></div><div class="row"><div class="field"><label>${t('customerName')}</label><input id="customerName" value="${esc(form.name)}"></div><div class="field"><label>${t('phone')}</label><input id="phone" type="tel" inputmode="tel" value="${esc(form.phone)}"></div></div><div class="field"><label>${t('note')}</label><input id="note" value="${esc(form.note)}"></div><button class="btn primary wide" data-a="post" ${!activeShift()||!accounts.length?'disabled':''}>${t('post')}</button></div></main>`}
function records(){let inDate=ui.page==='dateSearch';let from=inDate?(ui.from||today()):today(),to=inDate?(ui.to||today()):today();if(from>to){let z=from;from=to;to=z}let arr=effectiveTx(from,to);if(ui.accountId){arr=arr.filter(x=>x.accountId===ui.accountId)}if(ui.search){let q=ui.search.toLowerCase();arr=arr.filter(x=>(x.name+' '+x.phone+' '+x.accountName+' '+x.provider+' '+x.recordedByName+' '+x.note).toLowerCase().includes(q))}if(ui.type!=='all')arr=arr.filter(x=>x.type===ui.type);let h=`<main class="page"><div class="eyebrow">${t('records')}</div><h1 class="page-title">${inDate?t('dateSearch'):t('today')}</h1><div class="card"><div class="row"><input class="input" id="search" placeholder="${t('search')}" value="${esc(ui.search)}"><select id="filterType" class="select"><option value="all">${t('all')}</option><option value="transfer" ${ui.type==='transfer'?'selected':''}>${t('transfer')}</option><option value="cashout" ${ui.type==='cashout'?'selected':''}>${t('cashout')}</option></select></div><button class="btn soft wide" style="margin-top:9px" data-a="dateSearch">${inDate?t('back'):t('dateSearch')}</button>${inDate?`<div class="row" style="margin-top:9px"><input class="input" id="from" type="date" value="${esc(from)}"><input class="input" id="to" type="date" value="${esc(to)}"></div><div class="hint" style="margin-top:7px">${from} → ${to}</div>`:''}</div><div class="card"><div class="label">${arr.length} ${t('records')}</div>${arr.length?arr.map(txRow).join(''):`<div class="empty">${t('noRecords')}</div>`}</div></main>`;return h}
function txRow(x){let isT=x.type==='transfer';return `<div class="tx" data-a="txDetail" data-id="${x.id}"><div class="tx-dot">${isT?'↗':'↙'}</div><div class="txmain"><div class="tx-title">${esc(x.name||'—')}</div><div class="tx-sub">${esc(x.phone||'—')} · ${esc(x.provider)} · ${esc(x.accountName)}<br>${time(x.createdAt)} · ${t('recordedBy')}: <b>${esc(x.recordedByName||'Unknown')}</b><br><span class="tag">${t('transactionId')}: ${esc(x.id)}</span></div><span class="tag">${isT?t('transfer'):t('cashout')}</span>${x.fee?`<span class="tag">${t('fee')}: ${money(x.fee)} Ks</span>`:''}</div><div class="tx-right"><div class="tx-amount ${isT?'transfer':'cashout'}">${isT?'−':'+'}${money(x.amount)}</div>${role==='owner'&&!x.isReversal?`<button class="btn danger" style="min-height:30px;padding:5px 8px;margin-top:5px;font-size:9px" data-a="reverse" data-id="${x.id}">${t('reverse')}</button>`:''}</div></div>`}

function profile(){if(ui.page)return profilePage();return `<main class="page"><div class="profile-head"><div class="profile-avatar">${String(S.settings.shopLogo||'').startsWith('data:image/')?`<img src="${esc(S.settings.shopLogo)}">`:esc(S.settings.shopLogo||'🏪')}</div><div><div class="eyebrow">${t('profile')}</div><h1 class="page-title" style="margin:2px 0 0">${esc(S.settings.shopName)}</h1></div></div><div class="menu">${menu('shop','◉',t('shop'),S.settings.shopName)}${menu('language','文',t('language'),S.settings.language==='my'?'မြန်မာ':'English')}${menu('theme','◒',t('themeTitle'),THEME_NAMES[S.settings.theme]||S.settings.theme)}${menu('accounts','▣',t('accountsManage'),S.accounts.filter(x=>!x.archived).length+' '+t('accounts'))}${menu('staff','♙',t('staff'),S.settings.staffList.filter(x=>x.active!==false).length+' '+t('staff'))}${menu('fees','%',t('fees'),'Transfer '+S.settings.feeRules.transfer.rate+'% · Cash Out '+S.settings.feeRules.cashout.rate+'%')}${menu('reports','▤',t('reports'),'Summary & export')}${role==='owner'?menu('shiftHistory','◷',t('shiftHistory'),S.shifts.length+' '+t('records')):''}${menu('backup','☁',t('backup'),S.settings.backup.history?.length?t('connected'):t('notConnected'))}${menu('security','⌁',t('security'),'Owner PIN')}</div></main>`}
function menu(page,icon,title,sub){return `<button class="menu-item" data-a="profilepage" data-v="${page}"><span class="menu-icon">${icon}</span><span class="mi-text"><b>${title}</b><small>${esc(sub)}</small></span><span class="chev">›</span></button>`}
function profilePage(){let p=ui.page;if(p==='shop')return shopPage();if(p==='language')return languagePage();if(p==='theme')return themePage();if(p==='accounts')return accountsPage();if(p==='staff')return staffPage();if(p==='fees')return feesPage();if(p==='reports')return reportPage();if(p==='backup')return backupPage();if(p==='security')return securityPage();if(p==='staffDetail')return staffDetail();if(p==='accountDetail')return accountDetail();if(p==='shiftHistory')return shiftHistoryPage();return ''}
function pageHead(title,sub=''){return `<button class="back" data-a="appBack">‹ ${t('back')}</button><div class="eyebrow">${t('profile')}</div><h1 class="page-title">${title}</h1>${sub?`<div class="page-sub">${sub}</div>`:''}`}
function shopPage(){return `<main class="page">${pageHead(t('shop'))}<div class="card"><div class="field"><label>${t('shop')}</label><input id="shopName" value="${esc(S.settings.shopName)}"></div><div class="logo-upload"><div class="logo-preview">${String(S.settings.shopLogo||'').startsWith('data:image/')?`<img src="${esc(S.settings.shopLogo)}">`:esc(S.settings.shopLogo||'🏪')}</div><div><label class="file-label">${t('upload')} <input id="logoFile" type="file" accept="image/png,image/jpeg,image/webp" hidden></label><div style="height:7px"></div><button class="btn soft" data-a="removeLogo">${t('remove')}</button><div class="hint">PNG/JPG/WEBP · 2MB</div></div></div><button class="btn primary wide" style="margin-top:16px" data-a="saveShop">${t('save')}</button></div></main>`}
function languagePage(){return `<main class="page">${pageHead(t('language'))}<div class="menu"><button class="menu-item ${S.settings.language==='my'?'selected':''}" data-a="language" data-v="my"><span class="menu-icon">က</span><span class="mi-text"><b>မြန်မာ</b><small>Myanmar</small></span><span>${S.settings.language==='my'?'✓':'›'}</span></button><button class="menu-item" data-a="language" data-v="en"><span class="menu-icon">A</span><span class="mi-text"><b>English</b><small>English</small></span><span>${S.settings.language==='en'?'✓':'›'}</span></button></div></main>`}
function themePage(){return `<main class="page">${pageHead(t('themeTitle'))}<div class="theme-grid">${Object.keys(THEMES).map(k=>`<button class="theme-card ${S.settings.theme===k?'selected':''}" data-a="theme" data-v="${k}"><span class="theme-preview preview-${k}"></span><b>${THEME_NAMES[k]}</b><small>${S.settings.theme===k?'✓ Selected':''}</small></button>`).join('')}</div></main>`}
function accountsPage(){let a=S.accounts.filter(x=>!x.archived);return `<main class="page">${pageHead(t('accountsManage'))}<div class="card"><div class="notice">${t('receiveLimit')} / ${t('sendLimit')} ကို account တစ်ခုချင်းစီမှာ သတ်မှတ်နိုင်ပါတယ်။</div></div>${a.map(accountCard).join('')}<button class="btn primary wide" data-a="newacc">+ ${t('newAccount')}</button></main>`}
function staffPage(){let list=S.settings.staffList;return `<main class="page">${pageHead(t('staff'))}<div class="card"><div class="label">${S.settings.language==='my'?'ဒီဖုန်းမှာ လက်ရှိမှတ်တမ်းတင်မယ့် Staff':'Staff used on this device'}</div><div class="field" style="margin-top:7px"><select id="currentStaff" class="select"><option value="">${t('choose')}</option>${list.filter(x=>x.active!==false).map(x=>`<option value="${x.id}" ${(S.settings.currentStaffId||device.staffId)===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="hint">${S.settings.language==='my'?'ရွေးထားတဲ့ Staff နာမည်နဲ့ Record ထဲမှာ Recorded by ပေါ်မယ်။':'Records will show this staff as Recorded by.'}</div></div><div class="card"><div class="field"><label>${t('name')}</label><input id="staffName" placeholder="${t('addStaff')}"></div><button class="btn primary wide" data-a="addStaff">+ ${t('addStaff')}</button></div>${list.length?list.map(s=>{let c=effectiveTx('', '').filter(x=>x.recordedById===s.id).length;return `<div class="staff-card"><button style="border:0;background:transparent;padding:0;display:flex;align-items:center;gap:11px;flex:1;text-align:left;color:inherit" data-a="staffDetail" data-id="${s.id}"><span class="staff-avatar">${esc((s.name||'?').charAt(0))}</span><span class="grow"><b>${esc(s.name)}</b><small>${c} ${t('records')} · ${s.active===false?t('inactive'):t('active')}</small></span></button><button class="icon-btn" data-a="toggleStaff" data-id="${s.id}">${s.active===false?'✓':'×'}</button></div>`}).join(''):`<div class="empty">${t('noRecords')}</div>`}</main>`}
function staffDetail(){let s=S.settings.staffList.find(x=>x.id===ui.staffId);if(!s)return staffPage();let arr=effectiveTx(ui.from||'',ui.to||'').filter(x=>x.recordedById===s.id);let fee=arr.reduce((a,x)=>a+num(x.fee),0);return `<main class="page">${pageHead(esc(s.name),t('staffRecords'))}<div class="stat-grid"><div class="stat"><b>${arr.length}</b><small>${t('count')}</small></div><div class="stat"><b>${money(arr.reduce((a,x)=>a+num(x.amount),0))}</b><small>${t('volume')}</small></div><div class="stat"><b>${money(fee)}</b><small>${t('fee')}</small></div><div class="stat"><b>${money(fee)}</b><small>${t('profit')}</small></div></div><div class="card" style="margin-top:12px"><div class="row"><input class="input" id="from" type="date" value="${esc(ui.from)}"><input class="input" id="to" type="date" value="${esc(ui.to)}"></div>${arr.length?arr.map(txRow).join(''):`<div class="empty">${t('noRecords')}</div>`}</div></main>`}
function limitStatus(limit,used){if(!limit)return{label:t('normal'),pct:0,remaining:null,cls:'normal'};let pct=Math.min(100,Math.round(used/limit*100)),remaining=Math.max(0,limit-used);if(remaining<=0)return{label:t('limitReached'),pct:100,remaining:0,cls:'danger'};if(pct>=80)return{label:t('nearLimit'),pct,remaining,cls:'warn'};return{label:t('normal'),pct,remaining,cls:'normal'}}
function accountDetail(){let a=S.accounts.find(x=>x.id===ui.accountId&&!x.archived);if(!a){ui.page=null;return profilePage()}let d=today(),tx=effectiveTx('', '').filter(x=>x.accountId===a.id),todayTx=tx.filter(x=>x.date===d),receiveUsed=todayTx.filter(x=>x.type==='cashout').reduce((z,x)=>z+num(x.amount),0),sendUsed=todayTx.filter(x=>x.type==='transfer').reduce((z,x)=>z+num(x.amount),0),rs=limitStatus(num(a.receiveLimit),receiveUsed),ss=limitStatus(num(a.sendLimit),sendUsed),vol=tx.reduce((z,x)=>z+num(x.amount),0),fees=tx.reduce((z,x)=>z+num(x.fee),0);let progress=(s,used)=>`<div class=\"limit-head\"><span>${s.label}</span><b>${s.pct}%</b></div><div class=\"progress\"><i style=\"width:${s.pct}%\"></i></div>${s.remaining===null?`<div class=\"hint\">${t('noLimit')}</div>`:`<div class=\"limit-foot\"><span>${t('used')}: ${money(used)} Ks</span><span>${t('remaining')}: ${money(s.remaining)} Ks</span></div>`}`;return `<main class=\"page\">${pageHead(a.provider+' · '+a.name,t('accountDetail'))}<div class=\"card account-detail-hero ${providerClass(a.provider)}\"><div class=\"account-top\"><div class=\"provider-icon\">${providerIcon(a.provider)}</div><div class=\"provider-meta\"><div class=\"provider-name\">${esc(a.provider)}</div><div class=\"account-name\">${esc(a.name)}</div></div></div><div class=\"account-detail-balance\">${money(accountBalance(a.id))} Ks</div><div class=\"hint\">${t('cash')} / Current Balance</div></div><div class=\"stat-grid\"><div class=\"stat\"><b>${money(vol)} Ks</b><small>${t('totalVolume')}</small></div><div class=\"stat\"><b>${money(fees)} Ks</b><small>${t('totalFees')}</small></div><div class=\"stat\"><b>${todayTx.length}</b><small>${t('today')}</small></div><div class=\"stat\"><b>${money(sendUsed+receiveUsed)} Ks</b><small>${t('used')}</small></div></div><div class=\"card\"><div class=\"eyebrow\">${t('limitStatus')}</div><h3 style=\"margin:4px 0 10px\">↓ ${t('todayReceive')}</h3><div class=\"limit-box ${rs.cls}\">${a.receiveLimit?progress(rs,receiveUsed):`<div class=\"hint\">${t('noLimit')}</div>`}</div><h3 style=\"margin:16px 0 10px\">↑ ${t('todaySend')}</h3><div class=\"limit-box ${ss.cls}\">${a.sendLimit?progress(ss,sendUsed):`<div class=\"hint\">${t('noLimit')}</div>`}</div></div><div class=\"card\"><div class=\"hero-row\"><div><div class=\"eyebrow\">${t('recentRecords')}</div><b>${tx.length} ${t('records')}</b></div><button class=\"btn soft\" data-a=\"accountAllRecords\" data-id=\"${a.id}\">${t('viewAll')}</button></div>${tx.slice(0,8).map(txRow).join('')||`<div class=\"empty\">${t('noRecords')}</div>`}</div></main>`}
function shiftHistoryPage(){let list=S.shifts.slice().sort((a,b)=>String(b.closedAt||b.openedAt).localeCompare(String(a.closedAt||a.openedAt)));return `<main class=\"page\">${pageHead(t('shiftHistory'),t('records'))}${list.length?list.map(sh=>`<div class=\"card shift-history-card\"><div class=\"hero-row\"><div><div class=\"eyebrow\">${sh.status==='open'?t('shiftOpenStatus'):t('shiftClosedStatus')}</div><h3 style=\"margin:3px 0\">${time(sh.openedAt)}${sh.closedAt?' → '+time(sh.closedAt):''}</h3></div><span class=\"shift-chip ${sh.status==='open'?'':'closed-chip'}\">${sh.status==='open'?t('shiftOpenStatus'):t('shiftClosedStatus')}</span></div><div class=\"shift-history-grid\"><div><small>${t('openedBy')}</small><b>${esc(sh.openedByName||'—')}</b></div><div><small>${t('closedBy')}</small><b>${esc(sh.closedByName||'—')}</b></div><div><small>${t('expectedCash')}</small><b>${money(num(sh.expectedCash))} Ks</b></div><div><small>${t('actualCash')}</small><b>${sh.status==='closed'?money(num(sh.closingCash))+' Ks':'—'}</b></div><div><small>${t('variance')}</small><b>${sh.status==='closed'?money(num(sh.variance))+' Ks':'—'}</b></div><div><small>${t('records')}</small><b>${S.transactions.filter(x=>x.shiftId===sh.id&&!x.isReversal&&x.status==='posted').length}</b></div></div></div>`).join(''):`<div class=\"card empty\">${t('noRecords')}</div>`}</main>`}
function feesPage(){let tr=S.settings.feeRules.transfer,co=S.settings.feeRules.cashout;return `<main class="page">${pageHead(t('fees'))}<div class="card"><div class="eyebrow">${t('transfer')}</div><h2 style="margin:4px 0 12px">${tr.rate}%</h2><div class="row"><div class="field"><label>${t('threshold')}</label><input id="transferThreshold" type="number" min="0" value="${tr.threshold}"></div><div class="field"><label>${t('rate')}</label><input id="transferRate" type="number" min="0" step="0.01" value="${tr.rate}"></div></div><div class="notice">${tr.threshold>0?`${money(tr.threshold)} Ks အောက် = 0 Ks · ${money(tr.threshold)} Ks နှင့်အထက် = ${tr.rate}%`:`${tr.rate}%`}</div></div><div class="card"><div class="eyebrow">${t('cashout')}</div><h2 style="margin:4px 0 12px">${co.rate}%</h2><div class="row"><div class="field"><label>${t('threshold')}</label><input id="cashoutThreshold" type="number" min="0" value="${co.threshold}"></div><div class="field"><label>${t('rate')}</label><input id="cashoutRate" type="number" min="0" step="0.01" value="${co.rate}"></div></div><div class="notice">${co.threshold>0?`${money(co.threshold)} Ks အောက် = 0 Ks · ${money(co.threshold)} Ks နှင့်အထက် = ${co.rate}%`:`0 Ks ကစပြီး ${co.rate}%`}</div></div><button class="btn primary wide" data-a="saveFees">${t('save')}</button></main>`}
function reportRange(){let d=today();if(ui.exportType==='month'){let x=new Date();let y=x.getFullYear(),m=String(x.getMonth()+1).padStart(2,'0');return [`${y}-${m}-01`,d]}if(ui.exportType==='custom')return [ui.exportFrom||d,ui.exportTo||d];return [d,d]}

async function handle(e){let a=e.currentTarget,v=a.dataset.v,id=a.dataset.id;if(a.dataset.a==='tab'){ui.tab=v;if(v!=='profile')ui.page=null;if(v==='add'&&a.dataset.type)form.type=a.dataset.type;render();return}if(a.dataset.a==='addCash'){if(!requireOwner())return;ui.cashMode='add';ui.modal='cash';render();renderModal();return}if(a.dataset.a==='withdrawCash'){if(!requireOwner())return;ui.cashMode='withdraw';ui.modal='cash';render();renderModal();return}if(a.dataset.a==='confirmCash'){if(!requireOwner())return;let amount=num($('cashAmount')?.value),note=($('cashNote')?.value||'').trim();if(amount<=0){toast(t('amount'));return}if(ui.cashMode==='withdraw'&&cashBalance()<amount){toast(t('insufficient'));return}let delta=ui.cashMode==='add'?amount:-amount;let rec={id:uid(),at:new Date().toISOString(),businessDate:today(),delta,reason:ui.cashMode==='add'?'owner_cash_add':'owner_cash_withdraw',refId:'',actorId:actor().id,actorName:actor().name,note};S.cashLedger.push(rec);audit(ui.cashMode==='add'?'CASH_ADDED':'CASH_WITHDRAWN',String(amount));ui.modal=null;await save();toast(ui.cashMode==='add'?t('cashAdded'):t('cashWithdrawn'));render();return}if(a.dataset.a==='txDetail'){if(e.target.closest('[data-a]')!==a)return;ui.txId=id;ui.modal='tx';render();renderModal();return}if(a.dataset.a==='shareReceipt'){let x=S.transactions.find(z=>z.id===id);if(!x)return;let text=`Money Ledger

${time(x.createdAt)}`;try{if(navigator.share)await navigator.share({title:'Money Ledger Receipt',text});else{await navigator.clipboard?.writeText(text);toast('Receipt copied')}}catch(e){}return}

ewPin').value,q=$('newPin2').value;if(p.length<4||p!==q){toast('PIN မတူပါ');return}S.settings.ownerPinHash=await sha(p);role='owner';ui.modal=null;await save();render();return}}
function sync(e){let id=e.target.id,v=e.target.value;if(id==='amount'){form.amount=v;form.fee='';let auto=feeFor(form.type,num(v));let f=$('fee');if(f)f.value=auto;let box=$('feePreview');if(box)box.textContent=money(auto)+' Ks'}if(id==='fee'){form.fee=v;let box=$('feePreview');if(box)box.textContent=money(num(v))+' Ks'}if(id==='entryAccount')form.accountId=v;if(id==='currentStaff'||id==='entryStaff'){let st=S.settings.staffList.find(x=>x.id===v&&x.active!==false);form.staffId=st?.id||'';S.settings.currentStaffId=st?.id||'';device={staffId:st?.id||null,staffName:st?.name||''};if(role!=='owner')role='staff';saveDevice();save();render();return}if(id==='customerName')form.name=v;if(id==='phone')form.phone=v;if(id==='note')form.note=v;if(id==='search')ui.search=v;if(id==='filterType')ui.type=v;if(id==='from')ui.from=v;if(id==='to')ui.to=v;if(id==='exportFrom')ui.exportFrom=v;if(id==='exportTo')ui.exportTo=v;if(['search','filterType','from','to'].includes(id))render()}
async function post(){if(!requireShift())return;let amount=num(form.amount),autoFee=feeFor(form.type,amount),fee=form.fee!==''?num(form.fee):autoFee,acc=S.accounts.find(a=>a.id===form.accountId),staffId=form.staffId||S.settings.currentStaffId||device.staffId||'',rec=S.settings.staffList.find(x=>x.id===staffId&&x.active!==false);if(!rec)rec=recordActor();if(rec.id==='unknown'){toast(S.settings.language==='my'?'မှတ်တမ်းတင်မည့် Staff ကို ရွေးပါ':'Select a staff member before posting');return}if(!acc||amount<=0||fee<0){toast(t('selectAccount'));return}if(form.type==='transfer'){if(accountBalance(acc.id)<amount){toast(t('insufficient'));return}if(acc.sendLimit&&dailyVolume(acc.id,'transfer',form.date||today())+amount>acc.sendLimit){toast(t('limitExceeded'));return}}else{if(cashBalance()<amount-fee){toast(t('insufficient'));return}if(acc.receiveLimit&&dailyVolume(acc.id,'cashout',form.date||today())+amount>acc.receiveLimit){toast(t('limitExceeded'));return}}let tx={id:uid(),date:form.date||today(),createdAt:new Date().toISOString(),accountId:acc.id,accountName:acc.name,provider:acc.provider,category:acc.category||'',type:form.type,amount,fee,accountDelta:form.type==='transfer'?-amount:amount,cashDelta:form.type==='transfer'?amount+fee:fee-amount,name:form.name.trim(),phone:form.phone.trim(),note:form.note.trim(),recordedById:rec.id,recordedByName:rec.name,status:'posted',shiftId:activeShift().id};S.transactions.unshift(tx);S.cashLedger.push({id:uid(),at:new Date().toISOString(),businessDate:tx.date,delta:tx.cashDelta,reason:'transaction',refId:tx.id,actorId:actor().id,actorName:actor().name});audit('TRANSACTION_POSTED',tx.id);form.amount='';form.fee='';form.name='';form.phone='';form.note='';await save();toast(t('saved'));render()}
async function reverse(id){if(!requireOwner())return;let tx=S.transactions.find(x=>x.id===id&&x.status==='posted'&&!x.isReversal);if(!tx){toast(t('reversed'));return}if(S.transactions.some(x=>x.reversalOf===id&&x.status==='posted')){toast(t('reversed'));return}if(!confirm(t('reverseConfirm')))return;let rev={...tx,id:uid(),createdAt:new Date().toISOString(),name:'REVERSAL · '+(tx.name||''),phone:tx.phone,note:'Reversal of '+tx.id,recordedById:actor().id,recordedByName:actor().name,status:'posted',reversalOf:tx.id,isReversal:true,fee:0,accountDelta:-num(tx.accountDelta),cashDelta:-num(tx.cashDelta)};S.transactions.unshift(rev);S.cashLedger.push({id:uid(),at:new Date().toISOString(),businessDate:tx.date,delta:-num(tx.cashDelta),reason:'transaction_reversal',refId:rev.id,actorId:actor().id,actorName:actor().name});audit('TRANSACTION_REVERSED',tx.id);await save();toast(t('saved'));render()}
async function createAccount(){if(!requireOwner())return;let provider=$('provider').value,name=$('accName').value.trim(),opening=num($('opening').value),receive=num($('receiveLimit').value),send=num($('sendLimit').value);if(!provider||!name){toast(t('accountName'));return}S.accounts.push({id:uid(),provider,name,openingBalance:opening,receiveLimit:receive,sendLimit:send,archived:false,createdAt:new Date().toISOString()});audit('ACCOUNT_CREATED',name);ui.modal=null;await save();render();toast(t('saved'))}
function dataRows(arr){return arr.map(x=>[x.id,x.date,x.createdAt,x.type,x.provider,x.accountName,x.amount,x.fee,x.name,x.phone,x.note,x.recordedByName,x.status]).filter(Boolean)}
async function loadScript(src,id){return new Promise((res,rej)=>{if(document.getElementById(id))return res();let s=document.createElement('script');s.src=src;s.id=id;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function saveBlob(blob,name){let u=URL.createObjectURL(blob),el=document.createElement('a');el.href=u;el.download=name;el.rel='noopener';el.style.display='none';document.body.appendChild(el);el.click();setTimeout(()=>{el.remove();URL.revokeObjectURL(u)},1200);return true}async function exportExcel(){let [from,to]=reportRange(),a=effectiveTx(from,to);try{await loadScript('https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js','sheetjs');if(typeof XLSX==='undefined')throw Error('sheetjs unavailable');let rows=[['Transaction ID','Date','Time','Type','Provider','Account','Amount','Fee','Customer Name','Phone','Note','Staff','Status'],...dataRows(a)];let ws=XLSX.utils.aoa_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Records');let out=XLSX.write(wb,{bookType:'xlsx',type:'array'});await saveBlob(new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),`money-ledger-${from}-${to}.xlsx`);toast(t('saved'))}catch(e){downloadCSV(a,from,to)}}
function downloadCSV(a,from,to){let rows=[['Transaction ID','Date','Time','Type','Provider','Account','Amount','Fee','Customer Name','Phone','Note','Staff','Status'],...dataRows(a)],csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\n'),blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(blob),el=document.createElement('a');el.href=u;el.download=`money-ledger-${from}-${to}.csv`;el.click();setTimeout(()=>URL.revokeObjectURL(u),500)}
async function exportPDF(){let [from,to]=reportRange(),a=effectiveTx(from,to);try{await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js','jspdf');let doc=new jspdf.jsPDF({orientation:'landscape'});doc.setFontSize(16);doc.text(String(S.settings.shopName||'Money Ledger'),14,15);doc.setFontSize(10);doc.text(`${from} -> ${to} | Fee ${money(a.reduce((z,x)=>z+num(x.fee),0))} Ks`,14,22);let y=31;let headers=['Date','Type','Account','Amount','Fee','Customer','Phone','Staff'];let xs=[14,38,62,112,145,165,215,255];doc.setFontSize(8);headers.forEach((h,i)=>doc.text(h,xs[i],y));y+=6;a.forEach(x=>{if(y>190){doc.addPage();y=15;headers.forEach((h,i)=>doc.text(h,xs[i],y));y+=6}let vals=[x.date,x.type==='transfer'?'Transfer':'Cash Out',String(x.accountName).slice(0,24),money(x.amount),money(x.fee),String(x.name||'-').slice(0,22),String(x.phone||'-').slice(0,18),String(x.recordedByName||'-').slice(0,16)];vals.forEach((v,i)=>doc.text(String(v),xs[i],y));y+=5});doc.save(`money-ledger-${from}-${to}.pdf`);toast(t('saved'))}catch(e){printReport(a,from,to)}}
function printReport(a,from,to){let w=window.open('','_blank');if(!w){toast('Popup blocked');return}let rows=a.map(x=>`<tr><td>${esc(x.date)}</td><td>${x.type==='transfer'?t('transfer'):t('cashout')}</td><td>${esc(x.accountName)}</td><td>${money(x.amount)}</td><td>${money(x.fee)}</td><td>${esc(x.name||'')}</td><td>${esc(x.phone||'')}</td><td>${esc(x.recordedByName||'')}</td></tr>`).join('');w.document.write(`<html><head><meta charset="utf-8"><title>Money Ledger PDF</title><style>body{font-family:Arial,sans-serif;padding:24px}h1{font-size:20px}table{width:100%;border-collapse:collapse;font-size:11px}th,td{border:1px solid #ddd;padding:7px;text-align:left}th{background:#f3f4f6}</style></head><body><h1>${esc(S.settings.shopName)}</h1><div>${from} → ${to}</div><table><thead><tr><th>Date</th><th>Type</th><th>Account</th><th>Amount</th><th>Fee</th><th>Customer</th><th>Phone</th><th>Staff</th></tr></thead><tbody>${rows}</tbody></table><script>window.onload=()=>setTimeout(()=>window.print(),250)<\/script></body></html>`);w.document.close()}
async function saveLocalBackup(){try{let snap={app:'Money Ledger',version:17,exportedAt:new Date().toISOString(),data:S};let text=JSON.stringify(snap);let stamp=new Date().toISOString().replace(/[:.]/g,'-');let id=uid(),name=`money-ledger-${stamp}.json`,size=new Blob([text]).size;let history=Array.isArray(S.settings.backup?.history)?S.settings.backup.history:[];let entry={id,name,at:snap.exportedAt,size};history.unshift(entry);S.settings.backup={mode:'local',lastAt:snap.exportedAt,lastSize:size,history:history.slice(0,12)};localStorage.setItem('money-ledger-backup-'+id,text);if(window.CapacitorFilesystem?.writeFile){try{await window.CapacitorFilesystem.writeFile({path:`MoneyLedger/Backups/${name}`,data:toB64(text),directory:'DOCUMENTS',recursive:true});}catch(e){}}await save(true);return true}catch(e){return false}}
async function localRestore(id){if(!requireOwner())return;try{let text=localStorage.getItem('money-ledger-backup-'+id);if(!text&&window.CapacitorFilesystem?.readFile){let meta=(S.settings.backup.history||[]).find(x=>x.id===id);if(meta){let r=await window.CapacitorFilesystem.readFile({path:`MoneyLedger/Backups/${meta.name}`,directory:'DOCUMENTS'});text=fromB64(r.data)}}if(!text)throw Error('missing');let x=JSON.parse(text);if(!x.data?.accounts||!Array.isArray(x.data.transactions))throw Error('bad');let old={...(S.settings.backup||{})};S=normalize(x.data);S.settings.backup=old;await save(true);render();toast(t('restored'))}catch(e){toast(t('backupFailed'))}}
function normalize(x){let d=JSON.parse(JSON.stringify(x||{}));d.version=17;d.settings=Object.assign({shopName:'ကျွန်တော့်ဆိုင်',shopLogo:'🏪',ownerPinHash:'',language:'my',theme:'matcha',staffList:[],feeRules:{transfer:{threshold:100000,rate:.2},cashout:{threshold:0,rate:.5}},accountSort:'provider',backup:{mode:'local',lastAt:'',lastSize:0,history:[]}},d.settings||{});d.settings.feeRules=Object.assign({transfer:{threshold:100000,rate:.2},cashout:{threshold:0,rate:.5}},d.settings.feeRules||{});d.settings.backup=Object.assign({mode:'local',lastAt:'',lastSize:0,history:[]},d.settings.backup||{});d.settings.backup.mode='local';d.settings.backup.history=Array.isArray(d.settings.backup.history)?d.settings.backup.history:[];d.settings.staffList=Array.isArray(d.settings.staffList)?d.settings.staffList:[];d.settings.currentStaffId=d.settings.currentStaffId||'';d.accounts=Array.isArray(d.accounts)?d.accounts:[];d.transactions=Array.isArray(d.transactions)?d.transactions:[];d.shifts=Array.isArray(d.shifts)?d.shifts:[];d.cashLedger=Array.isArray(d.cashLedger)?d.cashLedger:[];d.audit=Array.isArray(d.audit)?d.audit:[];d.accounts=d.accounts.map(a=>({...a,openingBalance:num(a.openingBalance),receiveLimit:num(a.receiveLimit),sendLimit:num(a.sendLimit),archived:!!a.archived}));d.transactions=d.transactions.map(x=>({...x,status:x.status||'posted',createdAt:x.createdAt||new Date().toISOString(),recordedById:x.recordedById||x.recordedBy||'',recordedByName:x.recordedByName||x.recordedBy||'Unknown',phone:x.phone||'',accountDelta:typeof x.accountDelta==='number'?x.accountDelta:(x.type==='transfer'?-num(x.amount):num(x.amount)),cashDelta:typeof x.cashDelta==='number'?x.cashDelta:(x.type==='transfer'?num(x.amount)+num(x.fee):num(x.fee)-num(x.amount))}));return d}
async function load(){let found=null;for(let k of [KEY,...OLD_KEYS]){let r=await get(k,true);if(r?.value){try{found=JSON.parse(r.value);break}catch(e){}}}if(found){S=normalize(found.data||found);if(!S.cashLedger.length&&typeof found.cash==='number')S.cashLedger=[{id:uid(),at:new Date().toISOString(),businessDate:today(),delta:num(found.cash),reason:'legacy_import',refId:'',actorId:'system',actorName:'System'}];await save()}let d=await get(DEVICE,false);if(d?.value)try{device=JSON.parse(d.value)}catch(e){}if(!S.settings.currentStaffId&&device.staffId&&S.settings.staffList.some(x=>x.id===device.staffId&&x.active!==false))S.settings.currentStaffId=device.staffId;if(!form.date)form.date=today();if(!form.accountId)form.accountId=S.accounts.find(a=>!a.archived)?.id||'';ui.sort=S.settings.accountSort||'provider';render();locked=false}
document.addEventListener('keydown',e=>{let a=e.target.closest('[data-a=accountDetail]');if(a&&(e.key==='Enter'||e.key===' ')){e.preventDefault();ui.accountId=a.dataset.id;ui.page='accountDetail';ui.tab='profile';render()}});document.addEventListener('change',e=>{if(e.target.id==='logoFile'&&e.target.files[0]){if(!requireOwner())return;let f=e.target.files[0];if(f.size>2*1024*1024){toast('Logo 2MB အောက်');return}let r=new FileReader();r.onload=async()=>{S.settings.shopLogo=r.result;await save();render()};r.readAsDataURL(f)}});setupBackNavigation();load();
})();
